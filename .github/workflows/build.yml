# Builds the Android app (.apk) and the Windows installer (.exe) on every push.
# Download them from the run's "Artifacts" section, or push a tag like v1.0.1 to make a Release.
name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Signing key (from repository secrets, optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Keep only the long base64 run, in case a label or spaces were pasted with it.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t' | grep -oE '[A-Za-z0-9+/]{200,}={0,2}' | head -1)
          if [ -n "$CLEAN" ] && printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/station.keystore" 2>/dev/null; then
            echo "STATION_KEYSTORE=$RUNNER_TEMP/station.keystore" >> "$GITHUB_ENV"
            echo "Using the station signing key."
          elif [ -n "$CLEAN" ]; then
            BAD=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid: ${#CLEAN} characters (expected about 3576, starting with MII), ${BAD} characters that do not belong. Paste only the long line of letters, nothing else."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Building a debug-signed APK; new builds will not install over old ones. See README → Signing."
          fi
      - name: Build APK
        working-directory: android
        env:
          STATION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STATION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$STATION_KEYSTORE" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew $TASK -PstationVersionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -1)
          cp "$APK" "out/AAF-eVote-Station-${VERSION}.apk"
      - name: Check the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging out/*.apk | grep -E "package:|sdkVersion|targetSdkVersion"
          "$BT/apksigner" verify --print-certs out/*.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    # Every build of main updates the release for the version in package.json (e.g. v1.0.0).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AAF eVote Station ${{ steps.v.outputs.tag }}
          body: |
            **Android** (Android 8 and newer, including 14–17): download the `.apk`, open it on the phone or tablet, allow installing from this source.
            **Windows** (10 and 11, 64-bit): download the `Setup .exe` and run it. If Windows SmartScreen appears, click *More info → Run anyway*.
            Set up the app with your school's AAF eVote address and a teacher account.
          files: files/*
          make_latest: true
